services:
  backend:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - personnelplanner

  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - personnelplanner

  queue:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - postgres
      - redis
    networks:
      - personnelplanner

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personnelplanner
      POSTGRES_USER: personnelplanner
      POSTGRES_PASSWORD: personnelplanner
    ports:
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - personnelplanner

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    networks:
      - personnelplanner

  frontend:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - personnelplanner

networks:
  personnelplanner:
    driver: bridge

volumes:
  postgres-data:
