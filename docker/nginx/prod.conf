# personnelplanner.sezginyurdakul.com: the Cloudflare Tunnel (cf-tunnel) sends plain HTTP here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Time-clock CSV imports.
    client_max_body_size 10M;

    # Docker's DNS, re-resolved so a recreated backend container is found without an nginx
    # restart (a cached IP otherwise answers 502).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php_upstream backend:9000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Laravel: the API, Sanctum's CSRF cookie and the health check.
    location ~ ^/(api|sanctum)/|^/up$ {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # The service worker must never be cached, or a new deploy is never picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed build output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
