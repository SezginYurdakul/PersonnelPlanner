# Production stack for https://personnelplanner.sezginyurdakul.com, reached through the
# shared Cloudflare Tunnel (cf-tunnel joins this stack's network and forwards to nginx).
# Run it through scripts/deploy-prod.sh: it passes backend/.env.production as --env-file,
# which the ${...} values below come from.
name: personnelplanner_prod

services:
  db:
    image: postgres:16-alpine
    container_name: personnelplanner_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: personnelplanner_redis
    restart: always
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile.prod
    image: personnelplanner_prod-backend
    container_name: personnelplanner_backend
    restart: always
    env_file:
      - ./backend/.env.production
    command: sh -c "php artisan optimize && exec php-fpm"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\", 9000); if ($$s) { fclose($$s); exit(0); } exit(1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # Generate runs here (ProjectPlan.md §28.11), as do the push and email notifications.
  queue:
    image: personnelplanner_prod-backend
    container_name: personnelplanner_queue
    restart: always
    env_file:
      - ./backend/.env.production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - backend_storage:/var/www/html/storage
    # Lets a running generate (up to 300 s) finish when a deploy replaces the container.
    stop_grace_period: 330s
    depends_on:
      backend:
        condition: service_started
      planner:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # CP-SAT roster solver (ProjectPlan.md §28), internal only.
  planner:
    build:
      context: ./planner
      dockerfile: ../docker/planner/Dockerfile
    container_name: personnelplanner_planner
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 2G

  nginx:
    build:
      context: ./frontend
      dockerfile: ../docker/nginx/Dockerfile.prod
      args:
        VITE_API_BASE_URL: https://personnelplanner.sezginyurdakul.com
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    container_name: personnelplanner_nginx
    restart: always
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  default:
    name: personnelplanner_prod_network

volumes:
  db_data:
  redis_data:
  backend_storage:
